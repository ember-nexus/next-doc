name: Test

on:
  - push

jobs:

  build-docker-image:
    runs-on: gh-4vcpu-ubuntu-latest-amd
    name: 'Build Docker Image'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image - AMD dev
        run: |
          docker buildx build \
            --target development \
            --cache-from type=gha,scope=amd-dev \
            --cache-to type=gha,mode=max,scope=amd-dev \
            --load \
            -t api-docs:dev-amd \
            -f ./tools/Dockerfile \
            .
          docker save api-docs:dev-amd | gzip > api-docs-dev-amd.tar.gz
      - name: Build Docker image - AMD prod
        run: |
          docker buildx build \
            --target production \
            --cache-from type=gha,scope=amd-prod \
            --cache-to type=gha,mode=max,scope=amd-prod \
            --load \
            --build-arg="VERSION=$( cat composer.json | jq -r .version )" \
            -t api-docs:prod-amd \
            -f ./tools/Dockerfile \
            .
          docker save api-docs:prod-amd | gzip > api-docs-prod-amd.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: docker-image-api-docs-dev-amd
          path: api-docs-dev-amd.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: docker-image-api-docs-prod-amd
          path: api-docs-prod-amd.tar.gz
          retention-days: 7

  cs:
    runs-on: ubuntu-latest
    name: 'CS Lint'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p /tmp/docker
      - uses: actions/download-artifact@v8
        with:
          name: docker-image-api-docs-dev-amd
          path: /tmp/docker
      - name: CS
        run: |
          docker load < /tmp/docker/api-docs-dev-amd.tar.gz
          docker run -v $(pwd):/core --user "$(id -u):$(id -g)" api-docs:dev-amd sh -c "pnpm install && pnpm run cs"

  quality:
    runs-on: ubuntu-latest
    name: 'Quality'
    timeout-minutes: 5
    needs:
      - build-docker-image
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p /tmp/docker
      - uses: actions/download-artifact@v8
        with:
          name: docker-image-api-docs-dev-amd
          path: /tmp/docker
      - name: Quality
        run: |
          docker load < /tmp/docker/api-docs-dev-amd.tar.gz
          docker run -v $(pwd):/core --user "$(id -u):$(id -g)" api-docs:dev-amd sh -c "pnpm install && pnpm run test"
