version: '3'

tasks:

  dev:build:
    cmds:
      - docker compose -f ./tools/docker-compose.yml build

  dev:up:
    cmds:
      - docker compose -f ./tools/docker-compose.yml up -d  --remove-orphans

  dev:down:
    cmds:
      - docker compose -f ./tools/docker-compose.yml down

  dev:cli:
    cmds:
      - docker compose -f ./tools/docker-compose.yml exec --user astro core /bin/bash

  check:all:
    desc: Run every check (build, tests, lint, spellcheck, e2e) in the order the build depends on.
    cmds:
      - task: check:build
      - task: check:test
      - task: check:lint
      - task: check:spellcheck
      - task: check:e2e

  check:build:
    cmds:
      - docker compose -f ./tools/docker-compose.yml exec --user astro core sh -c "cd /core && pnpm run build"

  check:test:
    cmds:
      - docker compose -f ./tools/docker-compose.yml exec --user astro core sh -c "cd /core && pnpm run test"

  check:lint:
    cmds:
      - docker compose -f ./tools/docker-compose.yml exec --user astro core sh -c "cd /core && pnpm run cs"

  check:spellcheck:
    cmds:
      - docker compose -f ./tools/docker-compose.yml exec --user astro core sh -c "cd /core && pnpm run spellcheck"

  check:e2e:
    desc: Run Playwright e2e tests (Chromium, in the separate `e2e` container) against a preview server of dist/.
    cmds:
      - sh ./tools/run-e2e.sh

  prod:build:
    cmds:
      - docker build -f tools/Dockerfile --target prod -t ember-nexus-api-docs:latest .

  prod:run:
    cmds:
      - docker run -p 80:80 ember-nexus-api-docs:latest

  swagger:generate:
    cmds:
      - find ./core/src/data/swagger -name '*.json' -print0 | sort -z | xargs -0 jq -s 'reduce .[1:][] as $x (.[0]; . * $x)' > ./core/src/data/swagger.json
